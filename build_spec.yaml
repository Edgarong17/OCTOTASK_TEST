version: 0.1
component: build
timeoutInSeconds: 1200
shell: bash

env:
  variables:
    APP_NAME: "octotask"
    REGION: "mx-queretaro-1"
    REPO: "mytodo"
  vaultVariables:
    OCI_USERNAME: ocid1.vaultsecret.oc1.mx-queretaro-1.amaaaaaase7jhxqa36kllm7zqbnyygobofzpkfbsqmsvdeom5rlqi5uqh2fa
    OCI_NAMESPACE: ocid1.vaultsecret.oc1.mx-queretaro-1.amaaaaaase7jhxqa2anc7lzvhtj67agd3qznjmsdkhjwvumh3tg5bokivupq
    OCI_AUTH_TOKEN: ocid1.vaultsecret.oc1.mx-queretaro-1.amaaaaaase7jhxqampe7bzmli2p5a4meoxyl2bhk2ivzbkxb3af627dozaqq
    DOCKER_HUB_TOKEN: ocid1.vaultsecret.oc1.mx-queretaro-1.amaaaaaase7jhxqahslvasz33o5lopjf5yjrsqvxmhkddevzjdkst4njlqgq
    DOCKER_HUB_USER: ocid1.vaultsecret.oc1.mx-queretaro-1.amaaaaaase7jhxqa6rwbcoilymgliccj3mcbfcu6uyczbkx74ibw5ypqwknq
  exportedVariables:
    - IMAGE_TAG

steps:
  - type: Command
    name: "Docker Login"
    command: |
      echo "${DOCKER_HUB_TOKEN}" | docker login --username "${DOCKER_HUB_USER}" --password-stdin
      
  - type: Command
    name: "Generar Tag"
    command: |
      set -e
      export IMAGE_TAG=$(date +%s)
      echo "Tag generado: $IMAGE_TAG"

  - type: Command
    name: "Login a OCIR"
    command: |
      echo "${OCI_AUTH_TOKEN}" | docker login ${REGION}.ocir.io \
        -u "${OCI_NAMESPACE}/${OCI_USERNAME}" \
        --password-stdin

  - type: Command
    name: "Build Docker Image"
    command: |
      cd MtdrSpring/backend
      docker build -t ${APP_NAME}:${IMAGE_TAG} .
  - type: Command
    name: "Tag & Push"
    command: |
      docker tag ${APP_NAME}:${IMAGE_TAG} \
        ${REGION}.ocir.io/${OCI_NAMESPACE}/${REPO}:${IMAGE_TAG}

      docker tag ${APP_NAME}:${IMAGE_TAG} \
        ${REGION}.ocir.io/${OCI_NAMESPACE}/${REPO}:latest

      docker push ${REGION}.ocir.io/${OCI_NAMESPACE}/${REPO}:${IMAGE_TAG}
      docker push ${REGION}.ocir.io/${OCI_NAMESPACE}/${REPO}:latest
    

outputArtifacts:
  - name: todolist_image_artifact
    type: DOCKER_IMAGE
    location: mx-queretaro-1.ocir.io/axyjwyhvlyvr/mytodo:latest